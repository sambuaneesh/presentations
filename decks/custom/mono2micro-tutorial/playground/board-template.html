<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Board · Cut the Monolith</title>
<meta name="theme-color" content="#ffffff">
<style>
/* Layout: a projector page (shown in an 1800×1000 frame that cannot scroll), white like the playground.
   The heading; then the leaderboard, one column; next to it, only when someone broke the rules, the rule-breakers.
   Few players: huge rows. As players arrive the rows shrink smoothly, down to the size where 7 rows fill the
   height; past 7, the top 7 stay (with "…and N more"). The rule-breakers shrink the same way, down to 5 rows.
   ?view=all (the next slide): everyone who joined, as tiles that fill the page: position and score, the
   rule-breakers with their reason, and those who never sent ("ran out of time"). */
@property --rh { syntax: '<length>'; inherits: true; initial-value: 200px }
@property --srh { syntax: '<length>'; inherits: true; initial-value: 110px }
:root {
	--bg: #ffffff; --ink: #1d2a44; --muted: #667085; --faint: #98a2b3; --line: #e4e7ec; --soft: #f6f7f9;
	--gold: #fbf3dc; --bad: #d62839;
	--display: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
	--rh: 200px; --srh: 110px;
	color-scheme: light;
	transition: --rh 700ms cubic-bezier(.2,.7,.2,1), --srh 700ms cubic-bezier(.2,.7,.2,1);
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html { background: var(--bg) }
body { margin: 0; height: 100vh; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--display); line-height: 1.2;
	padding: 24px max(32px, env(safe-area-inset-right, 0px)) 24px max(32px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px }
h1 { font: 700 56px/1.05 var(--display); margin: 0; letter-spacing: -0.02em; flex: none }
.boards { flex: 1; min-height: 0; display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr) }
.boards.two { grid-template-columns: minmax(0, 1.9fr) minmax(0, 1.1fr) }
.panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px }
.panel h2 { font: 700 30px var(--display); margin: 0; flex: none }
.cols.one { max-width: 1400px }
.cols { display: grid; gap: 0 32px; align-items: start; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)) }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; table-layout: fixed }
th, td { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
th { font-size: 16px; font-weight: 600; color: var(--muted); padding: 0 10px 6px; border-bottom: 2px solid var(--line) }
td { border-bottom: 1px solid var(--line); padding: 0 10px }
td.n, th.n { text-align: right }
.lb td { height: var(--rh); font-size: calc(var(--rh) * 0.46) }
.lb col.rk { width: calc(var(--rh) * 1.05) } .lb col.sc { width: calc(var(--rh) * 1.7) }
.lb th { font-size: 18px }
.lb td.rk { color: var(--muted); font-weight: 600 }
.lb tr.top td { background: var(--gold); font-weight: 700; font-size: calc(var(--rh) * 0.56) }
.lb tr.top td.rk { font-size: calc(var(--rh) * 0.62); color: inherit }
.lb tr.top + tr:not(.top) td { border-top: 2px solid var(--line) }
.lb tr.more td { height: calc(var(--rh) * 0.5); font-size: calc(var(--rh) * 0.3); color: var(--muted); border-bottom: 0 }
.empty { font-size: 34px; color: var(--muted); padding: 30px 4px }
.shame h2 { color: var(--bad); font-size: 38px }
.shame .box { border: 2px solid color-mix(in srgb, var(--bad) 40%, var(--line)); border-radius: 18px; padding: 6px 16px 8px; background: color-mix(in srgb, var(--bad) 3%, #fff) }
.shame td { height: var(--srh); font-size: calc(var(--srh) * 0.36); padding: 6px 10px }
.shame .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600 }
.shame .why { color: var(--bad); font-size: 0.72em; white-space: normal; margin-top: 2px }
.shame tr:last-child td { border-bottom: 0 }
.shame .more td { color: var(--muted); font-size: calc(var(--srh) * 0.34); height: auto; padding-top: 8px }
/* view=all: everyone who joined, as tiles that fill the page (sized to fit however many there are) */
body.all h1 { font-size: 48px }
.tiles { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; align-content: flex-start; gap: var(--gap, 12px) }
.tile { width: var(--tw); height: var(--th); border: 1.5px solid var(--line); border-radius: calc(var(--th) * 0.16); background: #fff;
	display: flex; align-items: center; gap: calc(var(--th) * 0.18); padding: 0 calc(var(--th) * 0.22); font-size: calc(var(--th) * 0.34); min-width: 0 }
.tile .rk { flex: none; min-width: 1.6em; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums }
.tile .bd { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.1 }
.tile .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tile .sub { font-size: 0.56em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 0.15em }
.tile .sc { flex: none; font-weight: 700; font-variant-numeric: tabular-nums }
.tile.top { background: var(--gold); border-color: #ecd9a0 }
.tile.top .rk { color: inherit }
.tile.bad { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)) }
.tile.bad .sub { color: var(--bad); font-weight: 600 }
.tile.bad .rk { color: var(--bad) }
.tile.late { border-style: dashed; color: var(--muted) }
.tile.late .nm { font-weight: 500 }
.upd { position: fixed; right: 14px; bottom: 8px; font-size: 12px; color: var(--faint) }
</style>
</head>
<body>
<h1 id="title">Class board</h1>
<div class="tiles" id="tiles" hidden></div>
<div class="boards" id="boards">
	<section class="panel lb" aria-label="Leaderboard"><div id="lb"></div></section>
	<section class="panel shame" aria-labelledby="h-shame" id="shame" hidden>
		<h2 id="h-shame">Thought you could get away with this??</h2>
		<div class="box" id="shame-list"></div>
	</section>
</div>
<div class="upd" id="upd"></div>
<script>
const Q = new URLSearchParams(location.search)
const BOARD = '__BOARD__', ROOM = Q.get('room') || '__ROOM__', ALL = Q.get('view') === 'all'
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;')
if (ALL) { document.body.classList.add('all'); $('title').textContent = 'Everyone'; $('tiles').hidden = false; $('boards').hidden = true }
// the score is CMod, rounded to one decimal (ties are judged on what is shown)
const score = (r) => { const v = Number(r.scores?.cmod); return Number.isFinite(v) ? Math.round(v * 10) / 10 : null }
const fmt = (v) => v.toFixed(1)
let rows = [], players = [], status = null

// one entry per phone: the latest cut of each device (or of each name, for a cut without a device);
// different phones with the same name become "Rahul" and "Rahul (2)"
function entries(raw) {
	const latest = new Map()
	for (const x of raw) {
		if (!x || typeof x !== 'object' || !x.scores) continue
		const key = x.device ? 'd:' + x.device : 'g:' + String(x.group ?? '').trim().toLowerCase()
		const o = latest.get(key)
		if (!o || Number(x.at) > Number(o.at)) latest.set(key, x)
	}
	const out = [...latest.values()].sort((a, b) => Number(a.at) - Number(b.at)), seen = {}
	for (const r of out) {
		const base = String(r.group ?? '').trim() || 'no name', k = base.toLowerCase()
		seen[k] = (seen[k] ?? 0) + 1
		r.label = seen[k] > 1 ? `${base} (${seen[k]})` : base
	}
	return out
}

function why(r) {
	const n = Number(r.scores.n) || 0, left = Number(r.unassigned) || 0
	const svc = `${n} service${n === 1 ? '' : 's'}`, out = `${left} class${left === 1 ? '' : 'es'} left out`
	if (n === 0) return 'nothing placed'
	if (n === 1) return 'one service = the monolith 🙃'
	if (n < 3 && left) return `${svc}, ${out}`
	if (n < 3) return `only ${svc}`
	if (left) return out
	return 'an empty service'
}

// how tall a row: huge for the first few players, shrinking until 7 rows fill the height; never more than 7 rows
const MAX_ROWS = 7, MAX_SHAME = 5
// (and never so tall that the name column gets squeezed: at most an eighth of the panel's width)
function fit(n, height, width) {
	const shown = Math.min(n, MAX_ROWS), more = n > MAX_ROWS ? 1 : 0
	return { shown, rh: Math.floor(Math.min(210, width / 8, (height - 40) / Math.max(shown + more * 0.5, 2.2))) }
}

// the ranking: standard competition ranking (equal scores share the rank: 1, 1, 1, 4 …)
function ranked(ok) { let rank = 0; return ok.map((r, i) => { if (i === 0 || score(r) !== score(ok[i - 1])) rank = i + 1; return [rank, r] }) }

// view=all: the best tile size for n tiles in w×h (about 4.2 : 1), never taller than 120px
function tileFit(n, w, h, gap = 12) {
	let best = { tw: w, th: 0 }
	for (let c = 1; c <= Math.max(1, n); c++) {
		const r = Math.ceil(n / c), tw = (w - gap * (c - 1)) / c, th = Math.min(tw / 4.2, (h - gap * (r - 1)) / r, 120)
		if (th > best.th) best = { tw: Math.floor(tw), th: Math.floor(th) }
	}
	return best
}
function drawAll() {
	// everyone who joined (or sent without joining): the ranked first, then the rule-breakers, then those who never sent
	const sentBy = new Map(rows.map((r) => [r.device ? 'd:' + r.device : 'g:' + r.label.toLowerCase(), r]))
	const ok = rows.filter((r) => r.scores.valid && score(r) != null).sort((a, b) => score(b) - score(a) || Number(a.at) - Number(b.at))
	const bad = rows.filter((r) => !r.scores.valid).sort((a, b) => Number(a.at) - Number(b.at))
	const late = players.filter((p) => !sentBy.has('d:' + p.device)).sort((a, b) => Number(a.at) - Number(b.at))
	// names for those who never sent: the same "(2)" rule as the board, counted after the senders
	const seen = {}
	for (const r of rows) { const k = String(r.group ?? '').trim().toLowerCase(); seen[k] = (seen[k] ?? 0) + 1 }
	for (const p of late) { const base = String(p.name ?? '').trim() || 'no name', k = base.toLowerCase(); seen[k] = (seen[k] ?? 0) + 1; p.label = seen[k] > 1 ? `${base} (${seen[k]})` : base }
	const closed = status === 'closed'
	const tiles = [
		...ranked(ok).map(([k, r]) => `<div class="tile${k <= 3 ? ' top' : ''}"><span class="rk">${['🥇', '🥈', '🥉'][k - 1] ?? k}</span><span class="bd"><span class="nm">${esc(r.label)}</span></span><span class="sc">${fmt(score(r))}</span></div>`),
		...bad.map((r) => `<div class="tile bad"><span class="rk">✗</span><span class="bd"><span class="nm">${esc(r.label)}</span><span class="sub">${why(r)}</span></span></div>`),
		...late.map((p) => `<div class="tile late"><span class="rk">⏱</span><span class="bd"><span class="nm">${esc(p.label)}</span><span class="sub">${closed ? 'ran out of time' : 'still cutting…'}</span></span></div>`),
	]
	const box = $('tiles'), { tw, th } = tileFit(tiles.length, box.clientWidth, box.clientHeight)
	box.style.setProperty('--tw', tw + 'px'); box.style.setProperty('--th', th + 'px')
	box.innerHTML = tiles.length ? tiles.join('') : `<div class="empty">Nobody has joined yet…</div>`
}

function draw() {
	if (ALL) return drawAll()
	const ok = rows.filter((r) => r.scores.valid && score(r) != null).sort((a, b) => score(b) - score(a) || Number(a.at) - Number(b.at))
	const bad = rows.filter((r) => !r.scores.valid).sort((a, b) => Number(a.at) - Number(b.at))
	$('shame').hidden = !bad.length
	$('boards').classList.toggle('two', bad.length > 0)
	const height = $('boards').clientHeight

	// the leaderboard: standard competition ranking (equal scores share the rank and the medal: 1, 1, 1, 4 …)
	if (!ok.length) $('lb').innerHTML = `<div class="empty">${rows.length ? 'No valid cuts yet…' : 'Waiting for the first cuts…'}</div>`
	else {
		let rank = 0
		const ranked = ok.map((r, i) => { if (i === 0 || score(r) !== score(ok[i - 1])) rank = i + 1; return [rank, r] })
		const { shown, rh } = fit(ranked.length, height, $('lb').clientWidth || 1400)
		document.documentElement.style.setProperty('--rh', rh + 'px')
		const medal = (k) => ['🥇', '🥈', '🥉'][k - 1]
		const more = ranked.length - shown
		const html = `<table><colgroup><col class="rk"><col><col class="sc"></colgroup><tr><th>#</th><th>player</th><th class="n">score</th></tr>` +
			ranked.slice(0, shown).map(([k, r]) => `<tr class="${k <= 3 ? 'top' : ''}"><td class="rk">${medal(k) ?? k}</td><td>${esc(r.label)}</td><td class="n">${fmt(score(r))}</td></tr>`).join('') +
			(more ? `<tr class="more"><td colspan="3">…and ${more} more</td></tr>` : '') + '</table>'
		$('lb').innerHTML = `<div class="cols one" style="--cols:1">${html}</div>`
	}

	// the rule-breakers: only when there are any; names and the reason, no scores
	if (bad.length) {
		const avail = height - 80, show = Math.min(bad.length, MAX_SHAME)
		const srh = Math.floor(Math.min(120, avail / Math.max(show + (bad.length > show ? 0.6 : 0), 2.5)))
		document.documentElement.style.setProperty('--srh', srh + 'px')
		$('shame-list').innerHTML = `<table>` +
			bad.slice(0, show).map((r) => `<tr><td><div class="who">${esc(r.label)}</div><div class="why">${why(r)}</div></td></tr>`).join('') +
			(bad.length > show ? `<tr class="more"><td>…and ${bad.length - show} more</td></tr>` : '') + '</table>'
	}
}

async function poll() {
	if (!BOARD.startsWith('http')) { $('upd').textContent = 'board not connected'; draw(); return }
	try {
		const get = (path) => fetch(`${BOARD}/${path}?room=${encodeURIComponent(ROOM)}`, { cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json() })
		const [raw, ps, st] = await Promise.all([get('cuts'), ALL ? get('players') : null, ALL ? get('state') : null])
		if (Array.isArray(raw)) rows = entries(raw)
		if (Array.isArray(ps)) players = ps
		if (st) status = st.status === 'open' && st.endsAt && st.now >= st.endsAt ? 'closed' : st.status
		$('upd').textContent = 'updated ' + new Date().toLocaleTimeString()
	} catch (e) { $('upd').textContent = 'cannot reach the board, retrying…' }
	draw()
	setTimeout(poll, 3000)
}
addEventListener('resize', draw)
draw(); poll()
</script>
</body>
</html>
