<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title>Presentations</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;700&display=swap" rel="stylesheet" />
		<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='3' width='14' height='10' rx='2' fill='%23d64533'/></svg>" />
		<style>
			html, body, #root { margin: 0; height: 100%; overflow: hidden; }
			/* The pack's panels inherit this; the desktop app sets it for them. */
			body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
		</style>
		<script>
			// Start the page's downloads now, alongside its scripts, not after them (src/routes.js
			// picks them up): the deck list and, when the address names a deck, the deck itself.
			;(function () {
				try {
					var opts = { cache: 'no-cache' }
					var json = function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)) }
					window.__ppIndex = fetch('decks/index.json', opts).then(json)
					window.__ppIndex.catch(function () {})
					var path = decodeURIComponent(location.hash.replace(/^#\/?/, '').split('?')[0]).replace(/[^a-z0-9/-]/g, '').replace(/^\/+|\/+$/g, '')
					if (path.indexOf('/') > 0) {
						window.__ppDeck = { path: path, json: fetch('decks/' + path + '.json', opts).then(json) }
						window.__ppDeck.json.catch(function () {})
					}
				} catch (e) {}
			})()
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
